<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="800" fill="#FFFFFF"/>
  
  <g transform="translate(400, 380)">
    <!-- Outer Quantum Arc (Cobalt Blue) - Top-Left to Top-Right -->
    <path d="M -155 -155 A 220 220 0 0 1 155 -155" 
          fill="none" 
          stroke="#0052FF" 
          stroke-width="36" 
          stroke-linecap="round"/>

    <!-- Middle Quantum Arc (Deep Midnight Blue) - Bottom-Left to Bottom -->
    <path d="M -180 50 A 220 220 0 0 0 -30 218" 
          fill="none" 
          stroke="#0A2540" 
          stroke-width="36" 
          stroke-linecap="round"/>

    <!-- Inner Core Arc (Solid Black) - Dynamic Swirl -->
    <path d="M -80 -60 A 110 110 0 1 1 60 80" 
          fill="none" 
          stroke="#000000" 
          stroke-width="32" 
          stroke-linecap="round"/>

    <!-- Gestalt Center Node (Quantum Dot - Cobalt Blue) -->
    <circle cx="0" cy="0" r="18" fill="#0052FF"/>

    <!-- Gestalt Closure Tail for the 'Q' (Solid Black & Royal Blue) -->
    <path d="M 85 85 L 195 195" 
          stroke="#000000" 
          stroke-width="38" 
          stroke-linecap="round"/>
    <path d="M 125 125 L 210 210" 
          stroke="#0052FF" 
          stroke-width="20" 
          stroke-linecap="round"/>
  </g>

  <!-- Typography: QuantikApps -->
  <text x="400" y="690" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" 
        font-size="46" 
        font-weight="700" 
        letter-spacing="5" 
        fill="#000000">
    QUANTIK<tspan fill="#0052FF">APPS</tspan>
  </text>
</svg>
